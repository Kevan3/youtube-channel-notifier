name: Notifier

# Runs YouTube Channel Notifier on GitHub Actions instead of a server, and
# publishes an encrypted, passphrase-protected video list to GitHub Pages.
#
# Privacy:
# - The SQLite database and the run history live on the `ycn-data` branch,
#   encrypted with YCN_DB_PASSPHRASE. The branch is force-pushed as a single
#   commit every run, so history never grows.
# - The Pages site only ever contains data encrypted with YCN_PAGE_PASSPHRASE;
#   it is decrypted in the viewer's browser.
# - Command output (which names channels and videos) never reaches the Actions
#   log. It is stored encrypted and shown on the page's Activity tab.
# - Manual-run inputs are read from the event file and masked, so they are not
#   printed in the step's environment listing.
#
# Notifications (email, Discord, POST webhook, weekly summary) are disabled:
# the page is the only output. Mail goes to Laravel's in-memory "array"
# mailer and is discarded; no webhook URLs are configured.
#
# Required secrets:  YCN_DB_PASSPHRASE, YCN_PAGE_PASSPHRASE (different, 20+ chars)
#
# Settings > Pages > Source must be set to "GitHub Actions".

on:
  schedule:
    # Every 30 minutes. GitHub runs schedules on a best-effort basis, so
    # expect some delay.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: What to run (output appears on the page's Activity tab)
        type: choice
        default: check
        options:
          - check
          - add-channel
          - remove-channel
          - mute-channel
          - list-channels
          - list-videos
          - add-excluded-word
          - remove-excluded-word
          - list-excluded-words
          - stats
      name:
        description: Channel label (add / remove / mute) or word (excluded words)
        required: false
      url:
        description: Channel URL or @handle (add-channel only)
        required: false
      channel_id:
        description: Channel ID, only if automatic extraction fails (add-channel only)
        required: false

# Every run reads and writes the same database, so runs must not overlap.
# Note: GitHub keeps at most one *pending* run per group; if a manual run is
# queued behind a running one and a scheduled run queues too, the manual run
# is cancelled. Just re-run it.
concurrency:
  group: ycn-database
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      COMMAND: ${{ inputs.command || 'check' }}
      DATA_BRANCH: ycn-data
      DB_FILE: ${{ github.workspace }}/database/database.sqlite
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      YCN_DB_PASSPHRASE: ${{ secrets.YCN_DB_PASSPHRASE }}
      YCN_PAGE_PASSPHRASE: ${{ secrets.YCN_PAGE_PASSPHRASE }}

    steps:
      - name: Check passphrases
        id: setup
        run: |
          problems=()
          for name in YCN_DB_PASSPHRASE YCN_PAGE_PASSPHRASE; do
            value="$(printenv "$name" || true)"
            if [ "${#value}" -lt 20 ]; then
              problems+=("Set the $name repository secret to a random string of at least 20 characters.")
            fi
          done
          if [ -n "$YCN_DB_PASSPHRASE" ] && [ "$YCN_DB_PASSPHRASE" = "$YCN_PAGE_PASSPHRASE" ]; then
            problems+=("YCN_DB_PASSPHRASE and YCN_PAGE_PASSPHRASE must be different.")
          fi

          if [ "${#problems[@]}" -eq 0 ]; then
            # Working paths ($RUNNER_TEMP isn't available to job-level env).
            {
              echo "DATA_DIR=$RUNNER_TEMP/ycn-data"
              echo "LOGS_FILE=$RUNNER_TEMP/logs.json"
              echo "RUN_LOG=$RUNNER_TEMP/run.log"
              echo "SITE_DIR=$RUNNER_TEMP/site"
            } >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          # Scheduled runs skip quietly until the secrets exist, instead of
          # failing (and emailing) every 30 minutes. Manual runs fail.
          level=$([ "$GITHUB_EVENT_NAME" = schedule ] && echo notice || echo error)
          for problem in "${problems[@]}"; do
            echo "::$level::Notifier not configured: $problem"
          done
          [ "$level" = notice ]

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - name: Setup PHP
        if: steps.setup.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, simplexml, pdo_sqlite, openssl
          coverage: none

      - name: Cache vendor
        if: steps.setup.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        if: steps.setup.outputs.ready == 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Configure environment
        if: steps.setup.outputs.ready == 'true'
        run: |
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "DB_CONNECTION=sqlite"
            echo "LOG_CHANNEL=stderr"
            echo "LOG_LEVEL=info"
            # Notifications are disabled: mail is kept in memory and discarded.
            echo "MAIL_MAILER=array"
            echo "APP_KEY="
          } > .env
          php artisan key:generate --force --no-interaction --quiet

      - name: Restore data
        if: steps.setup.outputs.ready == 'true'
        run: |
          decrypt() {
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:YCN_DB_PASSPHRASE -in "$1" -out "$2"
          }

          mkdir -p "$DATA_DIR"
          if git ls-remote --exit-code --heads "$REMOTE" "$DATA_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" "$REMOTE" "$DATA_DIR"
          fi

          if [ -f "$DATA_DIR/database.sqlite.enc" ]; then
            decrypt "$DATA_DIR/database.sqlite.enc" "$DB_FILE"
            echo "Database restored."
          else
            touch "$DB_FILE"
            echo "No saved database yet; starting with an empty one."
          fi

          if [ -f "$DATA_DIR/logs.json.enc" ]; then
            decrypt "$DATA_DIR/logs.json.enc" "$LOGS_FILE"
          else
            echo '[]' > "$LOGS_FILE"
          fi

          php artisan migrate --force --no-interaction --quiet

      - name: Run command
        id: run
        if: steps.setup.outputs.ready == 'true'
        run: |
          # Inputs come from the event file rather than `env:` so their values
          # are never printed in this step's environment listing.
          read_input() { jq -r --arg k "$1" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH"; }
          INPUT_NAME="$(read_input name)"
          INPUT_URL="$(read_input url)"
          INPUT_CHANNEL_ID="$(read_input channel_id)"
          for value in "$INPUT_NAME" "$INPUT_URL" "$INPUT_CHANNEL_ID"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          export INPUT_NAME INPUT_URL INPUT_CHANNEL_ID

          case "$COMMAND" in
            list-*|stats) writes=false ;;
            *) writes=true ;;
          esac

          require_name() {
            if [ -z "$INPUT_NAME" ]; then
              echo "The 'name' input is required for $COMMAND."
              exit 1
            fi
          }

          # channels:add and channels:remove prompt interactively, which
          # can't work without a terminal, so these call the app's own
          # actions directly. Inputs come in through env vars, never by
          # pasting them into PHP code.
          # shellcheck disable=SC2016 # PHP code: single quotes on purpose
          boot='require getenv("GITHUB_WORKSPACE")."/vendor/autoload.php";
                $app = require getenv("GITHUB_WORKSPACE")."/bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();'

          run_command() {
            case "$COMMAND" in
              check)
                php artisan channels:check --no-interaction
                ;;

              add-channel)
                require_name
                if [ -z "$INPUT_URL" ] && [ -z "$INPUT_CHANNEL_ID" ]; then
                  echo "Provide 'url' (or 'channel_id') for add-channel."
                  exit 1
                fi
                # shellcheck disable=SC2016 # PHP code: single quotes on purpose
                php -r "$boot"'
                  $name = getenv("INPUT_NAME");
                  $url = trim((string) getenv("INPUT_URL"));
                  $id = trim((string) getenv("INPUT_CHANNEL_ID"));

                  if (App\Models\Channel::where("name", $name)->exists()) {
                      fwrite(STDERR, "A channel named \"$name\" already exists.\n");
                      exit(1);
                  }

                  if ($id === "") {
                      if (! str_starts_with($url, "@") && ! preg_match("#^(https?://|www\.)#", $url)) {
                          $url = "@".$url;
                      }
                      $id = app(App\Actions\YouTube\ExtractYouTubeChannelId::class)->execute($url);
                  }

                  if (App\Models\Channel::where("channel_id", $id)->exists()) {
                      fwrite(STDERR, "A channel with ID $id already exists.\n");
                      exit(1);
                  }

                  $channel = App\Models\Channel::create([
                      "name" => $name,
                      "channel_id" => $id,
                      "last_checked_at" => null,
                  ]);
                  echo "Added \"$name\" ($id). Running initial import...\n";
                  app(App\Actions\CheckForVideos::class)->execute($channel);
                  echo "Done.\n";
                '
                ;;

              remove-channel)
                require_name
                # shellcheck disable=SC2016 # PHP code: single quotes on purpose
                php -r "$boot"'
                  $name = getenv("INPUT_NAME");
                  $channel = App\Models\Channel::where("name", $name)->first();
                  if (! $channel) {
                      fwrite(STDERR, "No channel named \"$name\".\n");
                      exit(1);
                  }
                  $channel->videos()->delete();
                  $channel->delete();
                  echo "Removed \"$name\".\n";
                '
                ;;

              mute-channel)
                require_name
                php artisan channels:mute "$INPUT_NAME" --no-interaction
                ;;

              add-excluded-word)
                require_name
                php artisan excluded-words:add "$INPUT_NAME" --no-interaction
                ;;

              remove-excluded-word)
                require_name
                php artisan excluded-words:remove "$INPUT_NAME" --no-interaction
                ;;

              list-channels)       php artisan channels:list --no-interaction ;;
              list-videos)         php artisan videos:list --no-interaction ;;
              list-excluded-words) php artisan excluded-words:list --no-interaction ;;
              stats)               php artisan other:stats --no-interaction ;;

              *)
                echo "Unknown command: $COMMAND"
                exit 1
                ;;
            esac
          }

          # All output goes to a private file, never to the Actions log.
          set +e
          ( set -e; run_command ) > "$RUN_LOG" 2>&1
          status=$?
          set -e

          ok=$([ "$status" -eq 0 ] && echo true || echo false)
          tail -c 20000 "$RUN_LOG" > "$RUN_LOG.tail"
          jq --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg command "$COMMAND" \
             --arg trigger "$GITHUB_EVENT_NAME" \
             --argjson ok "$ok" \
             --rawfile output "$RUN_LOG.tail" \
             '. + [{at: $at, command: $command, trigger: $trigger, ok: $ok, output: $output}] | .[-25:]' \
             "$LOGS_FILE" > "$LOGS_FILE.new"
          mv "$LOGS_FILE.new" "$LOGS_FILE"
          rm -f "$RUN_LOG" "$RUN_LOG.tail"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "writes=$writes" >> "$GITHUB_OUTPUT"
          echo "Finished '$COMMAND' with exit code $status. Output is on the page's Activity tab."

      # The database is only updated after a successful write. If notifications
      # failed partway, the next run detects the same videos again: a duplicate
      # alert is better than a missed one. The run history is saved every time.
      - name: Save data
        if: always() && steps.run.outputs.status != ''
        env:
          STATUS: ${{ steps.run.outputs.status }}
          WRITES: ${{ steps.run.outputs.writes }}
        run: |
          encrypt() {
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:YCN_DB_PASSPHRASE -in "$1" -out "$2"
          }

          if [ "$STATUS" = 0 ] && [ "$WRITES" = true ]; then
            encrypt "$DB_FILE" "$DATA_DIR/database.sqlite.enc"
          fi
          encrypt "$LOGS_FILE" "$DATA_DIR/logs.json.enc"

          cd "$DATA_DIR"
          rm -rf .git
          git init --quiet --initial-branch "$DATA_BRANCH"
          for file in database.sqlite.enc logs.json.enc; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Update notifier data"
          git push --quiet --force "$REMOTE" "$DATA_BRANCH"
          echo "Data saved."

      # Deployed on every run, even when nothing changed, so deploy times
      # don't reveal when new videos appeared.
      - name: Build page
        if: always() && steps.run.outputs.status != ''
        run: |
          mkdir -p "$SITE_DIR"
          cp .github/ycn-page/index.html .github/ycn-page/app.js \
             .github/ycn-page/style.css .github/ycn-page/robots.txt "$SITE_DIR/"
          php .github/ycn-page/export.php "$LOGS_FILE" "$SITE_DIR/data.json"

      - name: Upload page
        if: always() && steps.run.outputs.status != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
          retention-days: 1

      - name: Deploy page
        id: deploy
        if: always() && steps.run.outputs.status != ''
        uses: actions/deploy-pages@v4

      - name: Report result
        if: always() && steps.run.outputs.status != ''
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          if [ "$STATUS" != 0 ]; then
            echo "::error::'$COMMAND' failed. See the Activity tab on the page for details."
            exit 1
          fi
